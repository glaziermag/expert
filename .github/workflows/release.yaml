name: Release Expert
on:
  push:
    branches:
      - proof-base
      - proof-fix

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        name: "[fork-only] stand-in for release-please (outputs of a 0.2.0 release)"
        run: |
          {
            echo "release_created=true"
            echo "tag_name=v0.2.0"
            echo "major=0"
            echo "minor=2"
            echo "patch=0"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.release.outputs.release_created }}
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Create release branch
        shell: bash
        if: ${{ needs.release.outputs.release_created }}
        env:
          BRANCH: v${{ needs.release.outputs.major }}.${{  needs.release.outputs.minor }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

      - name: Create backport label
        shell: bash
        if: ${{ needs.release.outputs.release_created }}
        env:
          LABEL: v${{ needs.release.outputs.major }}.${{  needs.release.outputs.minor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh label create "release:backport $LABEL"

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          echo "[fork-only] would run gh release edit ${TAG_NAME} --draft=false"
